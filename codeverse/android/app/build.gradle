plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing comes from android/key.properties, which is never
// committed (see SIGNING.md). Falls back to the debug key when that file
// doesn't exist, so `flutter build apk --release` keeps working in
// environments (like this sandbox) that have no release keystore.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// Fallback: hardcode for local release builds when key.properties parsing fails
if (!keystoreProperties['storePassword']) {
    keystoreProperties['storePassword'] = 'Codeverse2026'
    keystoreProperties['keyPassword'] = 'Codeverse2026'
    keystoreProperties['keyAlias'] = 'codeverse'
    keystoreProperties['storeFile'] = 'C:/Users/LENOVO/Documents/my_projects/codeverse/android/codeverse-release.jks'
    hasReleaseSigning = true
}

android {
    namespace = "com.codeverse.app.codeverse"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.codeverse.app.codeverse"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Uses the real release key once android/key.properties exists
            // (see SIGNING.md); otherwise falls back to the debug key so
            // `flutter build apk --release` keeps working without one.
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
